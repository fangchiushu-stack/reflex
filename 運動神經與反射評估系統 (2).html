<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>運動神經與反射評估系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: sticky header with three role tabs; each view is a single column of panels; scoring views add a sticky bottom score bar. */
:root{
  --paper:#F7F8F6; --panel:#FFFFFF; --ink:#33403F; --muted:#76837F; --line:#E5EAE6;
  --accent:#5E9C97; --accent-ink:#FFFFFF; --accent-soft:#E8F2F0; --sun:#EFC983; --teal:#E9AE97; --sky:#9DB7DC;
  --good:#5B9A80; --good-soft:#E7F2EC; --warn:#BC914A; --warn-soft:#FAF2E1; --bad:#CD8576; --bad-soft:#F9ECE8;
  --good-mid:#BFE0D0; --warn-mid:#F1DDAF; --bad-mid:#F0C9BF;
  --display:"Huninn","Noto Sans TC","PingFang TC",sans-serif; --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:18px; --shadow:0 1px 2px rgba(60,80,75,.04),0 8px 24px rgba(60,80,75,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#161B1B; --panel:#1E2525; --ink:#E4ECEA; --muted:#A3B0AD; --line:#2F3938;
  --accent:#8CC5BF; --accent-ink:#13201F; --accent-soft:#233332; --sun:#E6C88F; --teal:#E2B3A2; --sky:#A9BFE0;
  --good:#8CC4AA; --good-soft:#20302A; --warn:#DDBB7E; --warn-soft:#352E20; --bad:#E3A497; --bad-soft:#3A2925;
  --good-mid:#2F5A47; --warn-mid:#5A4A28; --bad-mid:#5E3A32;
  --shadow:0 1px 2px rgba(0,0,0,.25); color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#161B1B; --panel:#1E2525; --ink:#E4ECEA; --muted:#A3B0AD; --line:#2F3938;
  --accent:#8CC5BF; --accent-ink:#13201F; --accent-soft:#233332; --sun:#E6C88F; --teal:#E2B3A2; --sky:#A9BFE0;
  --good:#8CC4AA; --good-soft:#20302A; --warn:#DDBB7E; --warn-soft:#352E20; --bad:#E3A497; --bad-soft:#3A2925;
  --good-mid:#2F5A47; --warn-mid:#5A4A28; --bad-mid:#5E3A32;
  --shadow:0 1px 2px rgba(0,0,0,.25); color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(900px 520px at 105% -8%,transparent,transparent 65%),radial-gradient(800px 480px at -8% 108%,transparent,transparent 65%),radial-gradient(700px 400px at 50% 50%,transparent,transparent 70%),var(--paper);background:radial-gradient(900px 520px at 105% -8%,color-mix(in srgb,var(--accent) 9%,transparent),transparent 65%),radial-gradient(800px 480px at -8% 108%,color-mix(in srgb,var(--sun) 12%,transparent),transparent 65%),radial-gradient(700px 400px at 50% 50%,color-mix(in srgb,var(--sky) 5%,transparent),transparent 70%),var(--paper);background-attachment:fixed;min-height:100vh;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.3}
h1,h2,h3{font-weight:400;letter-spacing:.01em} h2{font-size:1.5rem} h3{font-size:1.15rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.86rem}
header.top{position:sticky;top:0;z-index:20;background:var(--panel);background:color-mix(in srgb,var(--panel) 82%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.25}
.brand b{font-family:var(--display);font-size:1.25rem;font-weight:400}
.logo{width:40px;height:40px;flex:none;border-radius:12px;background:linear-gradient(140deg,var(--accent),var(--sky));box-shadow:0 3px 10px transparent;box-shadow:0 3px 10px color-mix(in srgb,var(--accent) 30%,transparent);display:grid;place-items:center}
.brandwrap{display:flex;gap:10px;align-items:center;margin-right:auto}
header.top::after{content:"";display:block;height:3px;background:linear-gradient(90deg,var(--accent),var(--sky) 35%,var(--lav,#C4B3DA) 60%,var(--teal) 80%,var(--sun));opacity:.85}
.brand span{font-size:.78rem;color:var(--muted)}
.roles{display:flex;gap:4px;background:var(--paper);padding:4px;border-radius:999px;border:1px solid var(--line)}
.roles a{padding:6px 14px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:500;font-size:.92rem}
.roles a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.status{font-size:.78rem;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.status.ok{color:var(--good);border-color:var(--good)} .status.local{color:var(--warn);border-color:var(--warn)}
main{max-width:1180px;margin:0 auto;padding:18px 16px 120px;display:flex;flex-direction:column;gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:140px;flex:1}
.field label{font-size:.82rem;color:var(--muted);font-weight:500}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;border-width:1.5px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea{min-height:80px;resize:vertical}
.btn{border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 18px;cursor:pointer;font-weight:500;white-space:nowrap}
a.btn{text-decoration:none;color:var(--ink);display:inline-block}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 3px 10px transparent;box-shadow:0 3px 10px color-mix(in srgb,var(--accent) 25%,transparent)}
.btn.pri:hover{background:var(--accent);background:color-mix(in srgb,var(--accent) 88%,#000);border-color:transparent}
.btn.pri:active{transform:translateY(1px)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;width:fit-content;max-width:100%}
.tabs button{border:0;background:none;padding:8px 16px;cursor:pointer;color:var(--muted);font-weight:500;border-radius:999px;white-space:nowrap}
.tabs button:hover{background:var(--paper)}
.tabs button[aria-selected="true"]{color:var(--accent-ink);background:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;padding:1px 8px;border-radius:999px;background:var(--paper);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.say{color:var(--accent);border-color:var(--accent-soft);background:var(--accent-soft)}
.chip.side{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.chip.good{color:var(--good);background:var(--good-soft);border-color:transparent}
.chip.bad{color:var(--bad);background:var(--bad-soft);border-color:transparent}
.chip.warn{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.note{border-left:4px solid var(--warn);background:var(--warn-soft);padding:10px 14px;border-radius:12px;font-size:.9rem}
.note.info{border-color:var(--accent);background:var(--accent-soft)}
/* rubric / scoring */
.sec{--sc:var(--accent);border:1px solid var(--line);border-top:5px solid var(--sc);border-radius:var(--r);background:var(--panel);overflow:hidden;scroll-margin-top:90px}
.sec-no{width:32px;height:32px;border-radius:11px;background:var(--panel);background:color-mix(in srgb,var(--sc) 22%,var(--panel));color:var(--sc);color:color-mix(in srgb,var(--sc) 65%,var(--ink));display:grid;place-items:center;font-family:var(--display);font-size:1rem;flex:none}
.sec-h{display:flex;gap:10px;align-items:center;padding:12px 16px;background:linear-gradient(90deg,var(--panel),var(--panel));background:linear-gradient(90deg,color-mix(in srgb,var(--sc) 13%,var(--panel)),var(--panel));border-bottom:1px solid var(--line);flex-wrap:wrap}
.sec-h h3{margin-right:auto}
.sec-sum{font-family:var(--mono);font-size:.9rem}
.grp-h{padding:8px 16px;font-weight:700;font-size:.92rem;color:var(--sc);color:color-mix(in srgb,var(--sc) 70%,var(--ink));border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item{display:grid;grid-template-columns:44px 1fr auto;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);align-items:center}
.item:last-child{border-bottom:0}
.item .code{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.item .txt{display:flex;flex-direction:column;gap:3px}
.item .tags{display:flex;gap:4px;flex-wrap:wrap}
.item.done-full{background:var(--good-soft)}
.item.done-part{background:var(--warn-soft)}
.item.done-zero{background:var(--bad-soft)}
.seg{display:flex;gap:4px}
.seg button{border:1.5px solid var(--line);border-radius:12px;background:var(--panel);min-width:42px;padding:8px 6px;cursor:pointer;font-family:var(--mono);font-weight:600}
.seg button:hover{border-color:var(--sc,var(--accent))}
.seg button[aria-pressed="true"]{transform:scale(1.05);color:var(--ink);font-weight:700}
.seg button[aria-pressed="true"].z{background:var(--bad-mid);border-color:var(--bad)}
.seg button[aria-pressed="true"].p{background:var(--warn-mid);border-color:var(--warn)}
.seg button[aria-pressed="true"].f{background:var(--good-mid);border-color:var(--good)}
.pts{font-family:var(--mono);font-size:.8rem;color:var(--muted);text-align:right}
details.ref{padding:0 16px 10px}
details.ref summary{cursor:pointer;font-size:.85rem;color:var(--muted);padding:6px 0}
.reftab{width:100%;border-collapse:collapse;font-size:.88rem}
.reftab td{border-top:1px solid var(--line);padding:5px 8px;vertical-align:top}
.reftab td:first-child{font-family:var(--mono);font-weight:600;width:56px;color:var(--accent)}
.ded{display:flex;gap:10px;align-items:flex-start;padding:8px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.ded input{margin-top:5px;width:18px;height:18px;accent-color:var(--bad)}
.ded:last-child{border-bottom:0}
/* score bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.06)}
.bar-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;line-height:1.15}
.stat small{font-size:.72rem;color:var(--muted)}
.stat b{font-family:var(--mono);font-size:1.15rem}
.stat.big b{font-size:1.7rem;color:var(--accent)}
.timer.over b{color:var(--bad)}
.bar .spacer{flex:1}
.progress{height:6px;border-radius:999px;background:var(--line);overflow:hidden;width:120px}
.progress i{display:block;height:100%;background:var(--accent)}
.jump{display:flex;gap:6px;flex-wrap:wrap}
/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table.data{border-collapse:collapse;width:100%;font-size:.9rem}
table.data th,table.data td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.data th{background:var(--paper);font-weight:600;font-size:.82rem;color:var(--muted);position:sticky;top:0}
table.data tr.click{cursor:pointer} table.data tr.click:hover td{background:var(--accent-soft)}
table.data td.n{font-family:var(--mono);text-align:right}
/* kpi + charts */
.kpi{display:flex;flex-direction:column;gap:2px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);position:relative;overflow:hidden}
.kpi{background:linear-gradient(140deg,var(--panel),var(--panel) 75%);background:linear-gradient(140deg,color-mix(in srgb,var(--kc,var(--accent)) 12%,var(--panel)),var(--panel) 75%);border-color:var(--line);border-color:color-mix(in srgb,var(--kc,var(--accent)) 22%,var(--line))}
.kpi b{color:var(--kc,var(--accent));color:color-mix(in srgb,var(--kc,var(--accent)) 70%,var(--ink))}
.kpi small{font-weight:500}
.grid3>.kpi:nth-child(4n+1){--kc:var(--accent)}.grid3>.kpi:nth-child(4n+2){--kc:var(--sun)}.grid3>.kpi:nth-child(4n+3){--kc:var(--teal)}.grid3>.kpi:nth-child(4n+4){--kc:var(--sky)}
.kpi small{color:var(--muted);font-size:.8rem} .kpi b{font-family:var(--mono);font-size:1.7rem;line-height:1.2}
.hbar{display:grid;grid-template-columns:minmax(120px,240px) 1fr 84px;gap:10px;align-items:center;font-size:.86rem;padding:3px 0}
.hbar .track{height:12px;background:var(--paper);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.hbar .track i{display:block;height:100%;background:var(--accent)}
.hbar .track i.good{background:var(--good)} .hbar .track i.warn{background:var(--warn)} .hbar .track i.bad{background:var(--teal)}
.hbar .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist{display:flex;gap:10px;align-items:flex-end;height:160px;padding:10px 4px 0;border-bottom:1px solid var(--line)}
.hist .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.hist .col i{display:block;width:100%;max-width:56px;background:linear-gradient(180deg,var(--sun),var(--accent));border-radius:10px 10px 0 0;min-height:2px}
.hist .col span{font-family:var(--mono);font-size:.8rem}
.hist-x{display:flex;gap:10px;padding:4px}
.hist-x span{flex:1;text-align:center;font-size:.78rem;color:var(--muted)}
/* login */
.login{max-width:960px;margin:24px auto 0;display:grid;grid-template-columns:1.15fr 1fr;gap:0;border-radius:24px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow)}
.login .l{background:radial-gradient(circle at 88% 14%,var(--sun) 0 64px,transparent 65px),radial-gradient(circle at 0% 108%,transparent 0 110px,transparent 111px),linear-gradient(145deg,var(--hero1,#E3F4EF) 0%,var(--hero2,#FDE9E1) 58%,var(--hero3,#FFF4DC) 100%);background:radial-gradient(circle at 88% 14%,color-mix(in srgb,var(--sun) 70%,transparent) 0 64px,transparent 65px),radial-gradient(circle at 0% 108%,color-mix(in srgb,var(--teal) 45%,transparent) 0 110px,transparent 111px),linear-gradient(145deg,var(--hero1,#E3F4EF) 0%,var(--hero2,#FDE9E1) 58%,var(--hero3,#FFF4DC) 100%);color:var(--ink);padding:34px;position:relative;overflow:hidden}
.login .l .kicker{display:inline-block;background:var(--panel);background:color-mix(in srgb,var(--panel) 70%,transparent);color:var(--accent);color:color-mix(in srgb,var(--accent) 70%,var(--ink));border-radius:999px;padding:3px 12px;font-size:.85rem;margin-bottom:12px}
.pulse{width:100%;height:70px;margin:6px 0 4px;display:block}
.pulse path{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.pulse .trace{stroke:#E0A15F;stroke-width:4;stroke-dasharray:60 900}
@media (prefers-reduced-motion:no-preference){.pulse .trace{animation:pulse 2.6s cubic-bezier(.6,.1,.3,1) infinite}@keyframes pulse{from{stroke-dashoffset:60}to{stroke-dashoffset:-900}}}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;padding:0;list-style:none}
.feat li{background:var(--panel);background:color-mix(in srgb,var(--panel) 65%,transparent);border-radius:14px;padding:10px 12px;font-size:.9rem;line-height:1.45}
.feat li b{display:block;color:var(--accent);color:color-mix(in srgb,var(--accent) 70%,var(--ink));font-family:var(--display);font-weight:400;font-size:1.05rem}
.login .l h1{font-size:2.3rem;margin-bottom:4px;line-height:1.2}

.login .r{background:var(--panel);padding:30px;display:flex;flex-direction:column;gap:14px}
@media (max-width:720px){header.top{position:static}.bar-in{gap:10px;padding:8px 12px}.stat.big b{font-size:1.4rem}.login{grid-template-columns:1fr}.item{grid-template-columns:34px 1fr}.item .seg{grid-column:2}.hbar{grid-template-columns:110px 1fr 46px}}
.teacher-entry{max-width:960px;margin:16px auto 0;width:100%;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--teal);border-radius:20px;padding:18px 22px}
.teacher-entry h2{font-size:1.15rem}
.err{color:var(--bad);font-size:.85rem;min-height:1.2em}
/* quiz */
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--panel);cursor:pointer;margin-top:8px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .L{width:30px;height:30px;border-radius:10px;background:var(--paper);display:grid;place-items:center;font-family:var(--display);flex:none}
.opt.right .L{background:var(--good);color:#fff}.opt.wrong .L{background:var(--bad);color:#fff}
.dots{display:flex;gap:6px;flex-wrap:wrap}.dots i{width:22px;height:8px;border-radius:999px;background:var(--line)}.dots i.ok{background:var(--good)}.dots i.no{background:var(--bad)}.dots i.cur{background:var(--sun)}
.cheer{font-family:var(--display);font-size:1.6rem;color:var(--accent);margin:0}
.opt.right{border-color:var(--good);background:var(--good-soft)} .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
/* modal + toast */
.modal-bg{position:fixed;inset:0;background:rgba(10,15,22,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 12px;overflow-y:auto}
.modal{background:var(--panel);border-radius:12px;max-width:860px;width:100%;padding:20px;display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;z-index:60;font-size:.9rem;max-width:90vw}
.spark{display:block}
@media (prefers-reduced-motion:no-preference){.item,.btn,.seg button,.opt,.kpi{transition:background .15s,border-color .15s,transform .12s}.kpi:hover,.opt:hover:not(:disabled){transform:translateY(-2px)}main>*{animation:rise .35s ease both}@keyframes rise{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}}
/* palette picker */
.pal{position:relative}
.pal summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;font-size:.82rem;color:var(--muted);background:var(--panel)}
.pal summary::-webkit-details-marker{display:none}
.pal .sw{display:inline-flex}.pal .sw i{width:12px;height:12px;border-radius:50%;margin-left:-3px;border:2px solid var(--panel)}
.pal-menu{position:absolute;right:0;top:calc(100% + 8px);background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 32px rgba(0,0,0,.12);padding:8px;display:flex;flex-direction:column;gap:4px;min-width:220px;z-index:40}
.pal-menu button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:8px 10px;border-radius:12px;cursor:pointer;text-align:left}
.pal-menu button:hover,.pal-menu button[aria-checked="true"]{background:var(--accent-soft)}
.pal-menu .sw i{width:18px;height:18px}

/* ===== scoring sheet (card layout, like 腦神經練習頁) ===== */
header.top{position:static}
#sbar{position:sticky;top:0;z-index:25}
.scorebar{background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.04)}
.scorebar{background:var(--panel)}
.sb-in{max-width:1000px;margin:0 auto;padding:8px 16px 0;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.sb-big{font-family:var(--display);line-height:1;white-space:nowrap}
.sb-big b{font-size:2rem;font-weight:400;color:var(--accent)}
.sb-big small{font-size:.95rem;color:var(--muted)}

.sg button[aria-pressed="true"].full{background:var(--good-mid);color:var(--ink)}

.rd button[aria-pressed="true"][data-v="正常"]{background:var(--good-mid);border-color:var(--good)}

.interp{font-size:.85rem;font-weight:600;color:var(--accent)}

const P={db:null,user:null,dl:null,uid:null,ready:false,cloud:false,isTeacher:true};
const localWatchers=[];
const LS='nn:';
function lsList(coll){const out=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith(LS+coll+'/')){const rest=k.slice((LS+coll+'/').length);if(!rest.includes('/')){const v=lsGetRaw(k);if(v)out.push({_id:rest,...v})}}}}catch{}return out}
function notifyLocal(path){const coll=path.split('/')[0];localWatchers.forEach(w=>{if(w.coll===coll||w.path===path)w.run()})}
const Store={
 async get(path){if(P.db){const s=await P.db.doc(path).get();return s.exists?s.data():null}return lsGetRaw(LS+path)},
 async set(path,data){if(P.db)return P.db.doc(path).set(data);lsSetRaw(LS+path,data);notifyLocal(path)},
 async del(path){if(P.db)return P.db.doc(path).delete();lsDelRaw(LS+path);notifyLocal(path)},
 watchColl(coll,cb,err){if(P.db)return P.db.collection(coll).onSnapshot(s=>cb(s.docs.map(d=>({_id:d.id,...d.data()})),s.metadata),err);const w={coll,run:()=>cb(lsList(coll),{fromCache:false})};localWatchers.push(w);w.run();return()=>{}},
 watchDoc(path,cb,err){if(P.db)return P.db.doc(path).onSnapshot(s=>cb(s.exists?s.data():null,s.metadata),err);const w={path,run:()=>cb(lsGetRaw(LS+path),{fromCache:false})};localWatchers.push(w);w.run();return()=>{}}
};
let writeChain=Promise.resolve();
function queuedSet(path,data){const p=writeChain.then(()=>Store.set(path,data));writeChain=p.catch(()=>{});return p}

async function initPlatform(){
  if(window.claude&&typeof window.claude.use==='function'){
    try{
      const [db,user,dl]=await Promise.all([claude.use('db').catch(()=>null),claude.use('user').catch(()=>null),claude.use('downloads').catch(()=>null)]);
      P.db=db;P.user=user;P.dl=dl;
      if(user){try{P.uid=await user.id()}catch{}try{P.isTeacher=!!(await user.canEdit())}catch{P.isTeacher=false}}
    }catch{}
  }
  P.cloud=!!P.db;P.ready=true;
  const s=$('#status');
  if(P.cloud){s.textContent='雲端同步';s.className='status ok';s.title='資料儲存在雲端，教師端可即時看到'}
  else{s.textContent='本機模式';s.className='status local';s.title='目前無法連到雲端資料庫，資料只存在這台裝置的瀏覽器'}
  render();
}

function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const c=document.createElement('canvas');c.id='confetti';document.body.appendChild(c);const x=c.getContext('2d');const W=c.width=innerWidth,H=c.height=innerHeight;const P0=PALETTES[palKey()];const cols=[P0.accent,P0.sun,P0.peach,P0.sky,P0.lav];const ps=Array.from({length:140},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*12,vy:-Math.random()*12-4,r:Math.random()*6+4,c:cols[Math.random()*cols.length|0],a:Math.random()*6}));let t=0;(function f(){x.clearRect(0,0,W,H);ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});if(++t<110)requestAnimationFrame(f);else c.remove()})()}
function sheetHTML(ctx,scores,ded,mode,find){ // mode: 'score' | 'learn' | 'view'
  let h='<div class="sheet">';
  R.forEach((s,si)=>{
    const got=ITEMS.filter(i=>i.sec===s.id).reduce((a,i)=>a+(scores&&scores[i.id]!=null?scores[i.id]:0),0);
    h+=`<section class="csec" id="sec-${ctx}-${s.id}" style="--sc:${secColors()[si%9]}"><div class="csec-h"><span class="code">${esc(SEC_CODE[s.id])}</span><h2>${esc(s.name)}</h2>`;
    h+=mode==='learn'?`<span class="sub">${SEC_MAX[s.id]} 分</span>`:`<span class="sub" id="ss-${ctx}-${s.id}">${got} / ${SEC_MAX[s.id]}</span>`;
    if(mode==='score')h+=`<button class="btn sm" data-act="fillsec" data-ctx="${ctx}" data-sec="${s.id}">本段全對</button>`;
    h+=`</div>`;
    if(s.note)h+=`<div class="snote">${esc(s.note)}</div>`;
    s.groups.forEach(g=>{
      if(g.name)h+=`<div class="subh">${esc(g.name)}</div>`;
      if(g.ref)h+=refTable(g.ref);
      g.items.forEach(([id])=>h+=itemRow(ctx,ITEM[id],scores,mode));
    });
    h+=findBlock(ctx,s,find,mode);
    h+=`</section>`;
  });
  const dsum=DED.reduce((a,[id,,p])=>a+(ded&&ded[id]?p:0),0);
  h+=`<section class="csec" id="sec-${ctx}-ded" style="--sc:#8A8F98"><div class="csec-h"><span class="code">倒扣</span><h2>倒扣項目</h2><span class="sub" id="ds-${ctx}">${mode==='learn'?'最多 −17':'−'+dsum}</span></div>`;
  if(mode==='score')h+=`<div class="snote">下列項目<b>未做到</b>才勾選。</div>`;
  DED.forEach(([id,t,p])=>{
    if(mode==='score')h+=`<label class="dedrow"><input type="checkbox" id="ded-${ctx}-${id}" data-act="ded" data-ctx="${ctx}" data-id="${id}" ${ded&&ded[id]?'checked':''}><span>${esc(t)}</span><span class="minus">−${p}</span></label>`;
    else h+=`<div class="dedrow" style="cursor:default"><span>${esc(t)}</span><span class="minus" style="${mode==='view'&&!(ded&&ded[id])?'color:var(--muted);font-weight:400':''}">${mode==='view'?(ded&&ded[id]?'已扣 −'+p:'未扣'):'−'+p}</span></div>`;
  });
  h+=`</section></div>`;
  return h;
}
function sectionJump(ctx){return `<div class="jump">${R.map(s=>`<button class="btn sm" data-act="jump" data-target="sec-${ctx}-${s.id}">${esc(s.name.replace(/（.*?）|：.*/g,''))}</button>`).join('')}</div>`}
function ctxState(ctx){return ctx==='p'?st.prac:st.exam}
function refreshItem(ctx,id){
  const S=ctxState(ctx);const i=ITEM[id];const v=S.scores[id];const el=document.getElementById(`it-${ctx}-${id}`);if(!el)return;
  el.classList.remove('full','part','zero');if(v!=null)el.classList.add(v===i.p?'full':v===0?'zero':'part');
  el.querySelectorAll('.sg button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.v===v)));
  const ss=document.getElementById(`ss-${ctx}-${i.sec}`);if(ss){const got=ITEMS.filter(x=>x.sec===i.sec).reduce((a,x)=>a+(S.scores[x.id]??0),0);ss.textContent=`${got} / ${SEC_MAX[i.sec]}`}

function refreshBar(ctx){
  const S=ctxState(ctx);if(!S)return;const r=scoreOf(S.scores,S.ded);
  const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v};
  set(`b-${ctx}-n`,r.n);set(`b-${ctx}-ded`,r.ded?'−'+r.ded:'0');set(`b-${ctx}-tot`,r.total);

let tickTimer=null;
function startTick(ctx){stopTick();const S=ctxState(ctx);const upd=()=>{const el=document.getElementById(`b-${ctx}-timer`);if(!el||!S)return;const el2=(Date.now()-S.start)/1000;if(ctx==='x'&&S.limit){const rem=S.limit*60-el2;el.textContent=(rem<0?'+':'')+fmtDur(Math.abs(rem));document.getElementById('b-x-timer-wrap').classList.toggle('over',rem<0)}else el.textContent=fmtDur(el2)};upd();tickTimer=setInterval(upd,1000)}
function stopTick(){if(tickTimer){clearInterval(tickTimer);tickTimer=null}}

const DEFAULT_HASH='75932bc6a2ad68f7de5c101a370ec11c62c1addb5b81294e333838c66781cb63';
const UNLOCK_HOURS=8;
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('nn-teacher:'+t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function teacherHash(){return lsGetRaw('nn-teacher-hash')||DEFAULT_HASH}
function teacherUnlocked(){let u=null;try{u=JSON.parse(sessionStorage.getItem('nn-teacher-ok'))}catch{}return !!(u&&u.h===teacherHash()&&Date.now()-u.t<UNLOCK_HOURS*3600e3)}
function setUnlocked(on){try{if(on)sessionStorage.setItem('nn-teacher-ok',JSON.stringify({h:teacherHash(),t:Date.now()}));else sessionStorage.removeItem('nn-teacher-ok')}catch{}}
let pwFails=0,pwLockUntil=0;
function renderTeacherLogin(){
  $('#main').innerHTML=`<div class="login" style="grid-template-columns:1fr 1fr;max-width:820px">
   <div class="l"><span class="kicker">教師專區</span><h1>教師入口</h1><p style="margin:10px 0 0">教師管理與考試評分需要輸入教師密碼。登入後在這個分頁保持 ${UNLOCK_HOURS} 小時，關閉分頁或按「教師登出」即上鎖。</p></div>
   <form class="r" id="tlogin" novalidate><h2>輸入教師密碼</h2>
    <div class="field"><label for="t-pw">教師密碼</label><input type="password" id="t-pw" autocomplete="current-password"></div>
    <div class="err" id="t-err"></div>
    <button class="btn pri" type="submit">進入${st.view==='exam'?'考試評分':'教師管理'}</button>
    <a class="btn ghost" href="#student">返回學生練習</a></form></div>`;
  const pw=$('#t-pw');pw.focus();
  $('#tlogin').addEventListener('submit',async e=>{e.preventDefault();const err=$('#t-err');
    if(Date.now()<pwLockUntil){err.textContent=`嘗試次數過多，請 ${Math.ceil((pwLockUntil-Date.now())/1000)} 秒後再試。`;return}
    if(!pw.value){err.textContent='請輸入密碼。';return}
    let h;try{h=await sha(pw.value)}catch{err.textContent='此瀏覽器不支援密碼驗證，請改用最新版 Chrome、Edge 或 Safari。';return}
    if(h===teacherHash()){pwFails=0;setUnlocked(true);updateTeacherBadge();render()}
    else{pwFails++;pw.value='';if(pwFails>=5){pwLockUntil=Date.now()+30000;pwFails=0;err.textContent='密碼錯誤次數過多，請 30 秒後再試。'}else err.textContent=`密碼錯誤，請再試一次（${pwFails}/5）。`}});
}

function stuQuiz(){

  if(q.i>=q.qs.length){const sc=q.ans.filter(a=>a.ok).length;
    return `<div class="panel"><p class="cheer">${sc>=9?'滿分等級，太厲害了！':sc>=7?'答得很好！':'再接再厲，看看解析吧！'}</p><h2>測驗完成：${sc} / ${q.qs.length}</h2>${q.saveNote?`<div class="note" style="margin-top:10px">${q.saveNote}</div>`:''}

  return `<div class="panel"><div class="row"><span class="chip">第 ${q.i+1} / ${q.qs.length} 題</span><span class="dots" aria-hidden="true">${q.qs.map((_,k)=>`<i class="${k<q.ans.length&&q.ans[k]?(q.ans[k].ok?'ok':'no'):k===q.i?'cur':''}"></i>`).join('')}</span><span class="chip good">已答對 ${q.ans.filter(x=>x.ok).length}</span></div>
  <h3 style="margin:12px 0 4px;font-family:var(--body)">${esc(Q[0])}</h3>

function parseRoster(text){const out=[];text.split(/\r?\n/).forEach(line=>{const parts=line.split(/[,\t，]/).map(s=>s.trim()).filter(Boolean);if(!parts.length)return;const sid=parts.find(p=>SID_RE.test(p));if(!sid)return;const rest=parts.filter(p=>p!==sid);const grade=rest.find(p=>GRADES.includes(p)||/^[1-5]$/.test(p));const g2=grade?(GRADES.includes(grade)?grade:GRADES[+grade-1]):'';const rest2=rest.filter(p=>p!==grade);out.push({sid:sid.toUpperCase(),name:rest2[0]||'',grade:g2,group:rest2[1]||''})});const m=new Map();out.forEach(r=>m.set(r.sid,r));return [...m.values()]}

  const pr=practiceByStudent();add('練習紀錄',[['學號','姓名','年級','時間','類型','方式','評分同學','分數','滿分','用時','未滿分項目'],...pr.flatMap(p=>p.sessions.sort((a,b)=>a.date-b.date).map(s=>[p.sid,p.name||'',p.grade||'',fmtDT(s.date),s.type==='quiz'?'小測驗':'技術練習',s.type==='quiz'?'':s.mode==='peer'?'同儕互評':'自我檢核',s.partner||'',s.type==='quiz'?s.score:s.total,s.type==='quiz'?10:MAX,fmtDur(s.dur),s.type==='checklist'?ITEMS.filter(i=>(s.scores?.[i.id]??0)<i.p).map(i=>i.id.toUpperCase()).join(' '):'']))],[12,10,8,14,9,9,12,6,6,7,40]);
  const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  await saveFile(`神經系統評估成績_${st.f.type||'全部'}_${stamp()}.xlsx`,new Blob([buf]));
}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('已複製，可直接貼到 Excel 或文件')}catch{showModal(`<h2>請手動複製</h2><p class="small muted">瀏覽器不允許自動複製，請全選下方文字後複製。</p><textarea style="min-height:240px" readonly>${esc(t)}</textarea><div class="row" style="justify-content:flex-end"><button class="btn" data-act="modal-close">關閉</button></div>`)}}

/* ================= Modal ================= */
function showModal(html){$('#overlay').innerHTML=`<div class="modal-bg" data-act="modal-bg"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;const f=$('#overlay .modal button,#overlay .modal textarea');if(f)f.focus()}
function closeModal(){$('#overlay').innerHTML='';if(st.view==='teacher')renderTeacher()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#overlay').innerHTML)closeModal();if(e.key==='Enter'&&e.target.matches('tr.click'))e.target.click()});

/* ================= 事件 ================= */
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.find){onFind(t);return}
  if(t.dataset.f){st.f[t.dataset.f]=t.value;renderTeacher();return}
  if(t.dataset.act==='ded'){const S=ctxState(t.dataset.ctx);if(S){if(t.checked)S.ded[t.dataset.id]=true;else delete S.ded[t.dataset.id];refreshBar(t.dataset.ctx)}return}
  if(t.id==='imp-file'){importFiles(t.files);t.value='';return}
  if(t.id==='s-roster-file'&&t.files[0]){t.files[0].text().then(txt=>{$('#s-roster').value=txt;toast('已載入，請確認後按「儲存名單」')});return}
});
document.addEventListener('input',e=>{const fe=e.target.closest&&e.target.closest('[data-find]');if(fe)onFind(fe);if(e.target.id==='f-q'){st.f.q=e.target.value;clearTimeout(window.__fq);window.__fq=setTimeout(renderTeacher,250)}});
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
  if(a==='modal-bg'){if(e.target===el)closeModal();return}
  switch(a){
  case 'modal-close':closeModal();break;
  case 'find-res':{const S=ctxState(el.dataset.ctx);if(!S)break;S.find=S.find||{};const d=S.find[el.dataset.sec]=S.find[el.dataset.sec]||{};d.res=d.res===el.dataset.v?'':el.dataset.v;el.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===d.res)));break}
  case 'palette':lsSetRaw('nn-palette',el.dataset.pal);applyPalette();document.getElementById('pal').open=false;render();if(st.view==='teacher'&&!document.querySelector('.modal'))renderTeacher();break;
  case 'logout':st.student=null;lsDelRaw('nn-student');st.mine=[];st.mineLoaded=false;st.prac=null;st.quiz=null;render();break;
  case 'stutab':st.stuTab=el.dataset.tab;if(el.dataset.tab==='practice'&&st.prac&&st.prac.phase==='done')st.prac=null;render();window.scrollTo(0,0);break;
  case 'jump':{const t=document.getElementById(el.dataset.target);if(t)t.scrollIntoView({behavior:'smooth',block:'start'});break}
  case 'score':{const S=ctxState(el.dataset.ctx);if(!S)break;const v=+el.dataset.v;if(S.scores[el.dataset.id]===v)delete S.scores[el.dataset.id];else S.scores[el.dataset.id]=v;refreshItem(el.dataset.ctx,el.dataset.id);refreshBar(el.dataset.ctx);break}
  case 'fillsec':{const S=ctxState(el.dataset.ctx);ITEMS.filter(i=>i.sec===el.dataset.sec).forEach(i=>{S.scores[i.id]=i.p;refreshItem(el.dataset.ctx,i.id)});refreshBar(el.dataset.ctx);break}
  case 'p-start':st.prac={phase:'run',mode:$('#pr-mode').value,partner:$('#pr-partner').value.trim().toUpperCase(),scores:{},ded:{},find:{},start:Date.now()};render();window.scrollTo(0,0);break;
  case 'p-cancel':showModal(`<h2>放棄這次練習？</h2><p>已評的分數不會儲存。</p><div class="row" style="justify-content:flex-end"><button class="btn" data-act="modal-close">繼續練習</button><button class="btn danger" data-act="p-discard">放棄</button></div>`);break;
  case 'p-discard':st.prac=null;$('#overlay').innerHTML='';render();break;
  case 'p-new':st.prac=null;render();break;
  case 'p-save':{const p=st.prac;const r=scoreOf(p.scores,p.ded);p.dur=Math.round((Date.now()-p.start)/1000);const scores={};ITEMS.forEach(i=>scores[i.id]=p.scores[i.id]??0);
    const sess={id:uid('s'),type:'checklist',mode:p.mode,partner:p.partner,date:Date.now(),dur:p.dur,raw:r.raw,ded:r.ded,total:r.total,max:MAX,scores,dedIds:Object.keys(p.ded),find:p.find||{}};
    p.scores=scores;p.phase='done';p.saveNote=await saveSession(sess);render();window.scrollTo(0,0);if(r.total>=cfg().passScore)confetti();break}
  case 'q-start':{const idx=QB.map((_,i)=>i);for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]}st.quiz={qs:idx.slice(0,10),i:0,ans:[],start:Date.now()};render();break}
  case 'q-pick':{const q=st.quiz;const k=+el.dataset.k;const Q=QB[q.qs[q.i]];q.ans[q.i]={q:q.qs[q.i],pick:k,ok:k===Q[2]};render();break}
  case 'q-next':{const q=st.quiz;q.i++;if(q.i>=q.qs.length){const sc=q.ans.filter(a=>a.ok).length;q.saveNote=await saveSession({id:uid('q'),type:'quiz',date:Date.now(),dur:Math.round((Date.now()-q.start)/1000),score:sc,max:10,wrong:q.ans.filter(a=>!a.ok).map(a=>a.q)});if(sc>=7)confetti()}render();break}
  case 'mine-export':{const d={kind:'ncku-neuro-practice',version:1,grade:st.student.grade,sid:st.student.sid,name:st.student.name||'',exportedAt:Date.now(),sessions:st.mine};await saveFile(`練習紀錄_${st.student.sid}_${stamp()}.json`,JSON.stringify(d));break}
  case 'mine-copy':{const d={kind:'ncku-neuro-practice',version:1,grade:st.student.grade,sid:st.student.sid,name:st.student.name||'',exportedAt:Date.now(),sessions:st.mine};copyText(JSON.stringify(d));break}
  /* 考試 */
  case 'x-start':{const x=st.exam;const sid=$('#x-sid').value.replace(/\s+/g,'').toUpperCase();if(!SID_RE.test(sid)){$('#x-err').textContent='請輸入學號（英文字母或數字，不含空白與符號）。';break}
    Object.assign(x.meta,{type:$('#x-type').value,term:$('#x-term').value.trim(),date:$('#x-date').value,examiner:$('#x-examiner').value.trim(),station:$('#x-station').value.trim(),grade:$('#x-grade').value,sid,name:$('#x-name').value.trim(),group:$('#x-group').value.trim()});
    x.limit=+$('#x-limit').value||0;st.examSetup={type:x.meta.type,term:x.meta.term,examiner:x.meta.examiner,station:x.meta.station};lsSetRaw('nn-exam-setup',st.examSetup);
    x.phase='run';x.start=Date.now();render();window.scrollTo(0,0);break}
  case 'x-cancel':showModal(`<h2>取消這次評分？</h2><p>尚未儲存的分數會遺失。</p><div class="row" style="justify-content:flex-end"><button class="btn" data-act="modal-close">繼續評分</button><button class="btn danger" data-act="x-discard">取消評分</button></div>`);break;
  case 'x-discard':{const keep=st.exam.meta;st.exam=newExam();Object.assign(st.exam.meta,{type:keep.type,term:keep.term,examiner:keep.examiner,station:keep.station});$('#overlay').innerHTML='';render();break}
  case 'x-save':saveExam(false);break;
  case 'x-save-force':saveExam(true);break;
  case 'x-edit':{const r=st.exams.find(z=>z._id===el.dataset.id);if(!r)break;$('#overlay').innerHTML='';st.exam={phase:'run',meta:{type:r.type,term:r.term,date:r.date,examiner:r.examiner,station:r.station||'',grade:r.grade,sid:r.sid,name:r.name,group:r.group},scores:{...(r.scores||{})},ded:{...(r.ded||{})},find:JSON.parse(JSON.stringify(r.find||{})),comment:r.comment||'',start:Date.now(),limit:0,editingId:r._id};location.hash='#exam';if(st.view==='exam')render();window.scrollTo(0,0);break}
  /* 管理 */
  case 'ttab':st.tTab=el.dataset.tab;renderTeacher();break;
  case 'rec-open':openRecord(el.dataset.id);break;
  case 'pr-open':openPracticeStudent(el.dataset.sid);break;
  case 'rec-del':showModal(`<h2>刪除這筆考試紀錄？</h2><p>刪除後無法復原。</p><div class="row" style="justify-content:flex-end"><button class="btn" data-act="rec-open" data-id="${esc(el.dataset.id)}">取消</button><button class="btn danger" data-act="rec-del-ok" data-id="${esc(el.dataset.id)}">確定刪除</button></div>`);break;
  case 'rec-del-ok':try{await Store.del('exams/'+el.dataset.id);toast('已刪除')}catch(err){toast('刪除失敗：'+(err.message||err.code))}closeModal();break;
  case 'rec-copy':{const r=st.exams.find(z=>z._id===el.dataset.id);if(!r)break;const lines=[`${r.term} ${r.type}　${r.date}`,`學號：${r.sid}　姓名：${r.name}　${r.grade} ${r.group}`,`總分：${r.total}（項目 ${r.raw}，倒扣 ${r.dedTotal}）　主考：${r.examiner}`,'',...R.map(s=>{const its=ITEMS.filter(i=>i.sec===s.id);return `${s.name}：${its.reduce((a,i)=>a+(r.scores?.[i.id]??0),0)}/${SEC_MAX[s.id]}`}),'','未拿滿分：'+(ITEMS.filter(i=>(r.scores?.[i.id]??0)<i.p).map(i=>`${i.id.toUpperCase()} ${i.t}`).join('；')||'無'),r.comment?'評語：'+r.comment:''];copyText(lines.join('\n'));break}
  case 'exp-xlsx':exportXlsx();break;
  case 'exp-csv':await saveFile(`神經系統評估逐項得分_${st.f.type||'全部'}_${stamp()}.csv`,csvOf(itemsTable(sortedFl())));break;
  case 'exp-copy':copyText([BASIC_H,...examRowsBasic(sortedFl())].map(r=>r.join('\t')).join('\n'));break;
  case 't-logout':setUnlocked(false);updateTeacherBadge();if(st.view!=='student')render();toast('已登出教師專區');break;
  case 'pw-change':{const er=$('#pw-err');const o=$('#pw-old').value,n=$('#pw-new').value,n2=$('#pw-new2').value;
    if(await sha(o)!==teacherHash()){er.textContent='目前密碼不正確。';break}
    if(n.length<6){er.textContent='新密碼至少需 6 碼。';break}
    if(n!==n2){er.textContent='兩次輸入的新密碼不一致。';break}
    lsSetRaw('nn-teacher-hash',await sha(n));setUnlocked(true);er.textContent='';['pw-old','pw-new','pw-new2'].forEach(id=>$('#'+id).value='');toast('教師密碼已變更');break}
  case 's-save':saveConfig({term:$('#s-term').value.trim()||'115-1',passScore:+$('#s-pass').value||60,examMinutes:+$('#s-min').value||0});break;
  case 's-roster':{const r=parseRoster($('#s-roster').value);await saveConfig({roster:r});toast(`名單已儲存，共 ${r.length} 人`);break}
  case 'imp-paste':importTexts([$('#imp-text').value]);break;
  }
});
function onFind(t){const S=ctxState(t.dataset.ctx);if(!S)return;S.find=S.find||{};const d=S.find[t.dataset.sec]=S.find[t.dataset.sec]||{};if(t.dataset.find==='_note')d.note=t.value;else{d.f=d.f||{};d.f[t.dataset.find]=t.value}const it=document.getElementById(`fi-${t.dataset.ctx}-${t.dataset.sec}`);if(it)it.textContent=interpFor(t.dataset.sec,d.f)}
async function importFiles(files){const texts=[];for(const f of files){try{texts.push(await f.text())}catch{}}importTexts(texts)}
async function importTexts(texts){let ok=0,bad=0;for(const t of texts){let d;try{d=JSON.parse(t.trim())}catch{bad++;continue}
  if(!d||d.kind!=='ncku-neuro-practice'||!SID_RE.test(String(d.sid||''))||!Array.isArray(d.sessions)){bad++;continue}
  const sid=String(d.sid).toUpperCase();const path='practice/imp-'+sid;
  const prev=st.practice.find(p=>p._id==='imp-'+sid);const map=new Map();(prev?.sessions||[]).forEach(s=>map.set(s.id,s));
  d.sessions.filter(s=>s&&s.id&&(s.type==='checklist'||s.type==='quiz')).forEach(s=>map.set(String(s.id),{id:String(s.id),type:s.type,mode:s.mode==='peer'?'peer':'self',partner:String(s.partner||''),date:+s.date||0,dur:+s.dur||0,raw:+s.raw||0,ded:+s.ded||0,total:+s.total||0,score:+s.score||0,max:+s.max||0,scores:typeof s.scores==='object'&&s.scores?Object.fromEntries(ITEMS.map(i=>[i.id,Math.min(i.p,Math.max(0,+s.scores[i.id]||0))])):undefined}));
  try{await queuedSet(path,{grade:GRADES.includes(d.grade)?d.grade:'',sid,name:String(d.name||'').slice(0,40),updatedAt:Date.now(),imported:true,sessions:[...map.values()].slice(-120)});ok++}catch{bad++}}
  toast(`匯入完成：成功 ${ok} 份${bad?`，無法辨識 ${bad} 份`:''}`);const ta=$('#imp-text');if(ta&&ok)ta.value='';}

/* ================= 啟動 ================= */
applyPalette();
document.addEventListener('click',e=>{const d=document.getElementById('pal');if(d&&d.open&&!d.contains(e.target))d.open=false});
route();
initPlatform();
</script>
